[package]
name = "cppgm-lower"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
path = "../../src/lower_crate.rs"

[lints]
workspace = true

[features]
default = []
test-support = ["cppgm-sema/test-support", "cppgm-syntax/test-support", "cppgm-ir/test-support"]
telemetry = ["cppgm-core/telemetry", "cppgm-ir/telemetry", "cppgm-syntax/telemetry", "cppgm-sema/telemetry"]

[dependencies]
cppgm-core = { workspace = true }
cppgm-ir = { workspace = true }
cppgm-syntax = { workspace = true }
cppgm-sema = { workspace = true }

[dev-dependencies]
cppgm-sema = { workspace = true, features = ["test-support"] }
cppgm-syntax = { workspace = true, features = ["test-support"] }
cppgm-ir = { workspace = true, features = ["test-support"] }
