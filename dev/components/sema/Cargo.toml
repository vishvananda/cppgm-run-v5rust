[package]
name = "cppgm-sema"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
path = "../../src/sema_crate.rs"

[lints]
workspace = true

[features]
default = []
test-support = ["cppgm-syntax/test-support"]
telemetry = ["cppgm-core/telemetry", "cppgm-syntax/telemetry"]

[dependencies]
cppgm-core = { workspace = true }
cppgm-syntax = { workspace = true }

[dev-dependencies]
cppgm-syntax = { workspace = true, features = ["test-support"] }
cppgm-core = { workspace = true, features = ["test-support"] }
