[workspace]
members = [".", "components/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false

[workspace.dependencies]
cppgm-core = { path = "components/core", default-features = false }
cppgm-ir = { path = "components/ir", default-features = false }
cppgm-syntax = { path = "components/syntax", default-features = false }
cppgm-sema = { path = "components/sema", default-features = false }
cppgm-lower = { path = "components/lower", default-features = false }
cppgm-opt = { path = "components/opt", default-features = false }
cppgm-native = { path = "components/native", default-features = false }

[package]
name = "cppgm-rust"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = ["telemetry"]
telemetry = [
    "cppgm-core/telemetry",
    "cppgm-ir/telemetry",
    "cppgm-syntax/telemetry",
    "cppgm-sema/telemetry",
    "cppgm-lower/telemetry",
    "cppgm-opt/telemetry",
    "cppgm-native/telemetry",
]

[dependencies]
cppgm-syntax = { workspace = true }
cppgm-sema = { workspace = true }
cppgm-core = { workspace = true }
cppgm-ir = { workspace = true }
cppgm-lower = { workspace = true }
cppgm-opt = { workspace = true }
cppgm-native = { workspace = true }
nix = { version = "=0.31.3", default-features = false }

[dev-dependencies]
cppgm-lower = { workspace = true, features = ["test-support"] }
cppgm-native = { workspace = true, features = ["test-support"] }
cppgm-ir = { workspace = true, features = ["test-support"] }

[lib]
path = "src/lib.rs"

[lints]
workspace = true

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"
unfulfilled_lint_expectations = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
exit = "deny"
mem_forget = "deny"
large_stack_arrays = "warn"
large_stack_frames = "warn"
too_many_lines = "warn"
excessive_nesting = "warn"

[[bin]]
name = "pptoken"
path = "bin/pptoken.rs"

[[bin]]
name = "posttoken"
path = "bin/posttoken.rs"

[[bin]]
name = "ppexpr"
path = "bin/ppexpr.rs"

[[bin]]
name = "preproc"
path = "bin/preproc.rs"

[[bin]]
name = "cppgm"
path = "bin/cppgm.rs"

[[bin]]
name = "abimangle"
path = "bin/abimangle.rs"

[[bin]]
name = "lowir"
path = "bin/lowir.rs"

[[bin]]
name = "lowiropt"
path = "bin/lowiropt.rs"

[[bin]]
name = "lowir2native"
path = "bin/lowir2native.rs"

[profile.release.package.cppgm-sema]
# The semantic crate dominates release code generation; distribute it further.
codegen-units = 64
